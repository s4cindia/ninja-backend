name: Deploy Backend to Staging

"on":
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ninja-backend
  ECS_CLUSTER: ninja-cluster
  ECS_SERVICE: ninja-backend-task-service
  TASK_DEFINITION_FAMILY: ninja-backend-task

jobs:
  build-and-deploy:
    name: Build and Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker BuildKit with GitHub Actions cache (saves ~2-3 min)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image with caching
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Set image output
        id: image-output
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      # Combined migration step (saves ~1-2 min by running resolve + deploy in one task)
      - name: Run Prisma migrations
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eo pipefail

          # Download current task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > migration-task-def.json

          # Update image in task definition and remove incompatible fields
          jq --arg IMAGE "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" '
            .containerDefinitions |= map(if .name == "ninja-backend" then .image = $IMAGE else . end) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)
          ' migration-task-def.json > migration-task-def-updated.json

          # Register new task definition with updated image
          MIGRATION_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://migration-task-def-updated.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "Registered migration task definition: $MIGRATION_TASK_DEF_ARN"

          # Combined: resolve failed migrations AND deploy in single task
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ env.ECS_CLUSTER }} \
            --task-definition $MIGRATION_TASK_DEF_ARN \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUPS }}],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "ninja-backend",
                "command": ["sh", "-c", "echo Checking migration status... && npx prisma migrate status && echo Marking old failed migrations as rolled-back... && npx prisma migrate resolve --rolled-back 20260222100000_feat_style_validation 2>/dev/null || true && npx prisma migrate resolve --rolled-back 20260319140000_add_tagged_pdf_path 2>/dev/null || true && echo Running migrations... && npx prisma migrate deploy"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task started: $TASK_ARN"

          # Wait for task to complete
          aws ecs wait tasks-stopped --cluster ${{ env.ECS_CLUSTER }} --tasks $TASK_ARN

          # Check exit code
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ env.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration failed with exit code: $EXIT_CODE"

            # Extract task ID from ARN for log stream name
            TASK_ID=$(echo $TASK_ARN | sed 's/.*task\///' | sed 's/.*\///')
            echo "Task ID: $TASK_ID"

            # Try to fetch CloudWatch logs for debugging
            echo "=== Fetching CloudWatch logs for debugging ==="
            aws logs get-log-events \
              --log-group-name "/ecs/ninja-backend-task" \
              --log-stream-name "ecs/ninja-backend/$TASK_ID" \
              --limit 50 \
              --query 'events[*].message' \
              --output text 2>/dev/null || echo "Could not fetch logs"

            exit 1
          fi

          echo "Migration completed successfully"

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.TASK_DEFINITION_FAMILY }} \
            --query taskDefinition > task-definition.json

      - name: Inject environment variables and secrets
        env:
          ACE_URL: ${{ secrets.ACE_SERVICE_URL }}
          REDIS_ARN: ${{ secrets.STAGING_REDIS_SECRET_ARN }}
          ANTHROPIC_ARN: ${{ secrets.STAGING_ANTHROPIC_SECRET_ARN }}
          GEMINI_ARN: ${{ secrets.STAGING_GEMINI_SECRET_ARN }}
          # axes4 PAC Cloud credentials -- unset (both GH secrets left
          # empty) is the expected state until a real axes4 subscription
          # exists (S4C is meeting them to discuss pricing first). Same
          # optional-injection pattern as ANTHROPIC_ARN/GEMINI_ARN above:
          # empty means the `if` below skips it, axes4PacService.isAvailable()
          # stays false, and the whole integration is a safe no-op. Setting
          # these two GH secrets (to the real key's and subscription ID's own
          # Secrets Manager ARNs) is the ONLY step needed to turn it on --
          # see src/config/axes4.config.ts's own header.
          AXES4_API_KEY_ARN: ${{ secrets.STAGING_AXES4_API_KEY_SECRET_ARN }}
          AXES4_SUBSCRIPTION_ID_ARN: ${{ secrets.STAGING_AXES4_SUBSCRIPTION_ID_SECRET_ARN }}
          # Web/worker split cutover switch (CodeRabbit catch on PR #615):
          # the rollout for that split needs a way to set PROCESS_ROLE=web
          # on THIS (existing) task once the new worker service is
          # confirmed healthy, without a code change/new PR for the
          # cutover moment itself. Unset (the default) is a no-op --
          # WEB_PROCESS_ROLE stays empty, the jq below omits PROCESS_ROLE
          # entirely, and this task keeps running in legacy/monolith mode
          # exactly as before that split existed. Set the
          # WEB_PROCESS_ROLE repo variable to "web" and redeploy when
          # ready to cut over.
          WEB_PROCESS_ROLE: ${{ vars.WEB_PROCESS_ROLE }}
          # axes4 trial/period quota -- plain numbers, not a secret. Unset
          # means axes4.config.ts's own conservative placeholder default
          # (500 pages / 30 days) applies instead; set both repo variables
          # to the real trial/plan's numbers once they're known (see
          # axes4-quota.service.ts for how these gate real API calls).
          AXES4_QUOTA_PAGES_PER_PERIOD: ${{ vars.AXES4_QUOTA_PAGES_PER_PERIOD }}
          AXES4_QUOTA_PERIOD_DAYS: ${{ vars.AXES4_QUOTA_PERIOD_DAYS }}
        run: |
          # Build secrets array conditionally
          SECRETS_ARRAY='[{"name": "REDIS_URL", "valueFrom": "'"$REDIS_ARN"'"}'
          if [ -n "$ANTHROPIC_ARN" ]; then
            SECRETS_ARRAY="$SECRETS_ARRAY"', {"name": "ANTHROPIC_API_KEY", "valueFrom": "'"$ANTHROPIC_ARN"'"}'
          fi
          if [ -n "$GEMINI_ARN" ]; then
            SECRETS_ARRAY="$SECRETS_ARRAY"', {"name": "GEMINI_API_KEY", "valueFrom": "'"$GEMINI_ARN"'"}'
          fi
          if [ -n "$AXES4_API_KEY_ARN" ]; then
            SECRETS_ARRAY="$SECRETS_ARRAY"', {"name": "AXES4_API_KEY", "valueFrom": "'"$AXES4_API_KEY_ARN"'"}'
          fi
          if [ -n "$AXES4_SUBSCRIPTION_ID_ARN" ]; then
            SECRETS_ARRAY="$SECRETS_ARRAY"', {"name": "AXES4_SUBSCRIPTION_ID", "valueFrom": "'"$AXES4_SUBSCRIPTION_ID_ARN"'"}'
          fi
          SECRETS_ARRAY="$SECRETS_ARRAY]"

          # Only inject a PROCESS_ROLE entry when WEB_PROCESS_ROLE is
          # actually set -- otherwise the array stays empty and the jq's
          # own filter (which always strips any existing PROCESS_ROLE
          # first) leaves the task with none, i.e. legacy mode.
          ROLE_ENV_ARRAY='[]'
          if [ -n "$WEB_PROCESS_ROLE" ]; then
            ROLE_ENV_ARRAY='[{"name": "PROCESS_ROLE", "value": "'"$WEB_PROCESS_ROLE"'"}]'
          fi

          # Only inject AXES4_QUOTA_* when BOTH are set -- a half-set pair
          # (pages but no days, or vice versa) would leave the quota
          # service reading one real number and one stale code fallback,
          # silently mismatched.
          AXES4_QUOTA_ENV_ARRAY='[]'
          if [ -n "$AXES4_QUOTA_PAGES_PER_PERIOD" ] && [ -n "$AXES4_QUOTA_PERIOD_DAYS" ]; then
            AXES4_QUOTA_ENV_ARRAY='[{"name": "AXES4_QUOTA_PAGES_PER_PERIOD", "value": "'"$AXES4_QUOTA_PAGES_PER_PERIOD"'"}, {"name": "AXES4_QUOTA_PERIOD_DAYS", "value": "'"$AXES4_QUOTA_PERIOD_DAYS"'"}]'
          fi

          jq --arg aceurl "$ACE_URL" \
             --argjson secrets "$SECRETS_ARRAY" \
             --argjson roleEnv "$ROLE_ENV_ARRAY" \
             --argjson quotaEnv "$AXES4_QUOTA_ENV_ARRAY" '
            # Update environment variables (remove API keys - they will be added as secrets)
            (.containerDefinitions[0].environment) |= (
              map(select(.name != "ACE_SERVICE_URL" and .name != "S3_BUCKET" and .name != "S3_REGION" and .name != "ANTHROPIC_API_KEY" and .name != "GEMINI_API_KEY" and .name != "AXES4_API_KEY" and .name != "AXES4_SUBSCRIPTION_ID" and .name != "VERAPDF_PATH" and .name != "PROCESS_ROLE" and .name != "AXES4_QUOTA_PAGES_PER_PERIOD" and .name != "AXES4_QUOTA_PERIOD_DAYS")) +
              [
                {"name": "ACE_SERVICE_URL", "value": $aceurl},
                {"name": "S3_BUCKET", "value": "ninja-epub-staging"},
                {"name": "S3_REGION", "value": "ap-south-1"},
                {"name": "VERAPDF_PATH", "value": "/opt/verapdf/verapdf"}
              ] + $roleEnv + $quotaEnv
            ) |
            # Add secrets section
            (.containerDefinitions[0].secrets) |= (
              (. // []) |
              map(select(.name != "REDIS_URL" and .name != "ANTHROPIC_API_KEY" and .name != "GEMINI_API_KEY" and .name != "AXES4_API_KEY" and .name != "AXES4_SUBSCRIPTION_ID")) +
              $secrets
            )
          ' task-definition.json > task-definition-updated.json
          mv task-definition-updated.json task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ninja-backend
          image: ${{ steps.image-output.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      # Removed extra sleep - wait-for-service-stability already handles it

      - name: Setup Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests against staging
        id: integration
        continue-on-error: true
        env:
          API_BASE_URL: ${{ vars.STAGING_API_URL }}
          TEST_AUTH_TOKEN: ${{ secrets.STAGING_TEST_TOKEN }}
        run: |
          echo "Running integration tests against staging..."
          npm run test:integration

      - name: Report integration test outcome
        if: always()
        run: |
          echo "Integration test outcome: ${{ steps.integration.outcome }}"
